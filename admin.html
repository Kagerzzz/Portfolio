<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Quản Trị Portfolio Sanvithi</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* Admin Dashboard Custom Styles */
    .admin-container {
      max-width: 1100px;
      margin: 100px auto 60px;
      padding: 0 24px;
    }
    
    .admin-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    
    .login-box {
      max-width: 420px;
      margin: 120px auto;
    }
    
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }
    
    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--text-main);
    }
    
    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }
    
    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-pill);
      background: var(--text-main);
      color: var(--bg-main);
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .btn-submit:hover { opacity: 0.9; }

    .btn-sm {
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
    }

    .btn-danger { background: #EF4444; color: #FFF; }
    .btn-secondary { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); }
    
    /* Table */
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    
    .admin-table th, .admin-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }
    
    .admin-table th {
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      font-size: 12px;
    }
    
    .table-thumb {
      width: 60px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header Nav -->
  <header class="header">
    <nav class="nav-wrapper">
      <a href="index.html" class="nav-brand">Sanvi Saya Portfolio</a>
      <span class="nav-link" style="font-weight: 600; color: var(--text-main);">🔒 Admin CMS Dashboard</span>
      <div class="nav-actions">
        <a href="index.html" class="btn-say-hi">Xem Trang Portfolio ↗</a>
        <button id="btn-logout" class="btn-icon hidden" title="Đăng xuất">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <!-- LOGIN VIEW (HIỂN THỊ KHI CHƯA ĐĂNG NHẬP) -->
    <section id="login-view" class="admin-container">
      <div class="admin-card login-box">
        <h2 class="font-serif" style="font-size: 1.8rem; margin-bottom: 8px; text-align: center;">Đăng Nhập Admin</h2>
        <p style="font-size: 13px; color: var(--text-dim); margin-bottom: 24px; text-align: center;">
          Nhập tài khoản Supabase Auth để quản lý dự án
        </p>

        <form id="form-login">
          <div class="form-group">
            <label class="form-label">Email Admin</label>
            <input type="email" id="login-email" class="form-input" placeholder="admin@sanvithi.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Mật Khẩu</label>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-submit">Đăng Nhập Quản Trị</button>
        </form>
      </div>
    </section>

    <!-- DASHBOARD VIEW (HIỂN THỊ SAU KHI ĐĂNG NHẬP THÀNH CÔNG) -->
    <section id="dashboard-view" class="admin-container hidden">
      <div class="admin-card">
        
        <div class="admin-header">
          <div>
            <h2 class="font-serif" style="font-size: 2rem;">Danh Sách Dự Án (Case Studies)</h2>
            <p style="font-size: 13px; color: var(--text-dim);">Dữ liệu được đồng bộ trực tiếp với Supabase Database</p>
          </div>
          <button class="btn-say-hi" onclick="openProjectModal()">+ Thêm Dự Án Mới</button>
        </div>

        <!-- Table Projects -->
        <table class="admin-table">
          <thead>
            <tr>
              <th>Ảnh</th>
              <th>Tiêu đề / Slug</th>
              <th>Khách hàng</th>
              <th>Thứ tự</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="table-projects-body">
            <!-- Rendered by js/admin.js -->
          </tbody>
        </table>

      </div>
    </section>
  </main>

  <!-- MODAL EDIT/ADD PROJECT -->
  <div id="project-edit-modal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeProjectModal()">✕</button>
      <div class="modal-content-area">
        <h2 id="modal-form-title" class="font-serif" style="font-size: 1.8rem; margin-bottom: 20px;">Thêm Dự Án Mới</h2>
        
        <form id="form-project">
          <input type="hidden" id="project-id">
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label">Tiêu đề Dự án</label>
              <input type="text" id="project-title" class="form-input" placeholder="Explora — Empowering scientists..." required>
            </div>
            <div class="form-group">
              <label class="form-label">Slug (Định danh URL)</label>
              <input type="text" id="project-slug" class="form-input" placeholder="explora" required>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label">Khách hàng / Client</label>
              <input type="text" id="project-client" class="form-input" placeholder="Cellworks Biotech">
            </div>
            <div class="form-group">
              <label class="form-label">Vai trò / Role</label>
              <input type="text" id="project-role" class="form-input" placeholder="Founding Product Designer">
            </div>
            <div class="form-group">
              <label class="form-label">Thời gian / Year</label>
              <input type="text" id="project-year" class="form-input" placeholder="13 Months ∙ Shipped">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Mô tả ngắn (Summary trên trang chủ)</label>
            <textarea id="project-summary" class="form-textarea" placeholder="I set the product strategy for a biotech platform..."></textarea>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label">Đường dẫn Ảnh (Image URL hoặc assets/saas.png)</label>
              <input type="text" id="project-image-url" class="form-input" placeholder="assets/saas.png">
            </div>
            <div class="form-group">
              <label class="form-label">Chủ đề màu Stage Background</label>
              <select id="project-stage-bg" class="form-select">
                <option value="explora">Sage Green (explora)</option>
                <option value="miraai">Warm Coral (miraai)</option>
                <option value="manage">Steel Blue (manage)</option>
                <option value="research">Purple Haze (research)</option>
                <option value="insurance">Warm Tan (insurance)</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label">Nhãn bên Trái (cách nhau bởi dấu phẩy)</label>
              <input type="text" id="project-left-labels" class="form-input" placeholder="Design Systems, Shipped">
            </div>
            <div class="form-group">
              <label class="form-label">Nhãn bên Phải (cách nhau bởi dấu phẩy)</label>
              <input type="text" id="project-right-labels" class="form-input" placeholder="0 to 1, R&D tool">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Chỉ số Tác động Metrics (JSON format hoặc ví dụ mặc định)</label>
            <input type="text" id="project-metrics" class="form-input" value='[{"val":"~$1.2M","label":"Recovered"},{"val":"100%","label":"Adoption"}]'>
          </div>

          <div class="form-group">
            <label class="form-label">📌 Tổng quan (Overview)</label>
            <textarea id="project-overview" class="form-textarea"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">⚡ Thách thức (The Challenge)</label>
            <textarea id="project-challenge" class="form-textarea"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">💡 Giải pháp (The Solution)</label>
            <textarea id="project-solution" class="form-textarea"></textarea>
          </div>

          <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn-submit" style="flex: 2;">Lưu Dự Án Vào Database</button>
            <button type="button" class="btn-submit btn-secondary" onclick="closeProjectModal()" style="flex: 1;">Hủy</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">Đã cập nhật dữ liệu!</div>

  <!-- Scripts -->
  <script src="js/supabase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
